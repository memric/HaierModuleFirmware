name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        idf_ver: ["v6.0"]
        idf_target: ["esp32c3"]
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ matrix.idf_ver }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Build ESP project
        env:
          IDF_TARGET: ${{ matrix.idf_target }}
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          idf.py build
